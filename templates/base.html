<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PayOps{% endblock %}</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <div class="sidebar">

        <div>

            <div class="logo">
                PayOps
            </div>

            <div class="tagline">
                Smart business operations platform
            </div>

            <nav>

                <a href="/"
                   class="nav-link">
                    Dashboard
                </a>

                <a href="/customers"
                   class="nav-link">
                    Customers
                </a>

                <a href="/estimates"
                   class="nav-link">
                    Estimates
                </a>

                <a href="/invoices"
                   class="nav-link">
                    Invoices
                </a>

            </nav>

        </div>

        <div class="sidebar-bottom">

            <a href="/settings"
               class="nav-link">
                Settings
            </a>

        </div>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        {% block content %}
        {% endblock %}

    </div>

</div>

</body>

</html>
