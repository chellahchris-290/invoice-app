<!DOCTYPE html>
<html>

<head>

    <title>Create Invoice - InvoiceFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            InvoiceFlow
        </div>

        <div class="tagline">
            Create, track and manage invoices effortlessly.
        </div>

        <a href="/" class="nav-link">Dashboard</a>
        <a href="/invoice" class="nav-link">Create Invoice</a>
        <a href="/invoices" class="nav-link">View Invoices</a>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <div class="form-wrapper">

            <div class="form-card">

                <div class="form-header">

                    <h1>Create Invoice</h1>

                    <p class="subtext">
                        Enter the invoice information below.
                    </p>

                </div>

                <form action="/preview" method="POST">

                    <div class="form-section">

                        <h3>Customer Information</h3>

                        <div class="form-grid-2">

                            <div class="form-group">

                                <label>Customer Name</label>

                                <input
                                    type="text"
                                    name="customer"
                                    required>

                            </div>

                            <div class="form-group">

                                <label>Invoice Number</label>

                                <input
                                    type="text"
                                    name="invoice_number"
                                    required>

                            </div>

                        </div>

                    </div>

                    <div class="form-section">

                        <h3>Payment</h3>

                        <div class="form-group">

                            <label>Amount</label>

                            <input
                                type="number"
                                name="amount"
                                required>

                        </div>

                    </div>

                    <div class="form-footer">

                        <button type="submit">
                            Generate Invoice
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
