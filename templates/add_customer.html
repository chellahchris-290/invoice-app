{% extends "base.html" %}

{% block title %}Add Customer - InvoiceFlow{% endblock %}

{% block content %}

<div class="page-header">

    <h1>Add Customer</h1>

    <p class="subtext">
        Save your customer's details for future invoices.
    </p>

</div>

<div class="form-wrapper">

    <div class="form-card">

        <form method="POST" action="/add_customer">

            <div class="form-section">

                <h3>Customer Information</h3>

                <div class="form-group">

                    <label>Customer Name</label>

                    <input type="text"
                           name="name"
                           placeholder="John Banda"
                           required>

                </div>

                <div class="form-group">

                    <label>Phone Number</label>

                    <input type="text"
                           name="phone"
                           placeholder="+260 977 123456">

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input type="email"
                           name="email"
                           placeholder="customer@email.com">

                </div>

                <div class="form-group">

                    <label>Address</label>

                    <textarea name="address"
                              rows="4"
                              placeholder="Customer address"></textarea>

                </div>

            </div>

            <div class="form-footer">

                <button type="submit">
                    Save Customer
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
