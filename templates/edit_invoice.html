<!DOCTYPE html>
<html>

<head>
    <title>Edit Invoice - InvoiceFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="layout">

    <div class="sidebar">

        <div class="logo">InvoiceFlow</div>

        <div class="tagline">
            Create, track and manage invoices effortlessly.
        </div>

        <a href="/" class="nav-link">Dashboard</a>
        <a href="/invoice" class="nav-link">Create Invoice</a>
        <a href="/invoices" class="nav-link">View Invoices</a>

    </div>

    <div class="main-content">

        <h1>Edit Invoice</h1>

        <div class="content-panel">

            <form action="/update/{{ invoice[0] }}" method="POST">

                <p>Customer</p>
                <input type="text" name="customer" value="{{ invoice[1] }}" required>

                <br><br>

                <p>Invoice Number</p>
                <input type="text" name="invoice_number" value="{{ invoice[2] }}" required>

                <br><br>

                <p>Amount</p>
                <input type="number" name="amount" value="{{ invoice[3] }}" required>

                <br><br>

                <button type="submit">Update Invoice</button>

      <div class="form-wrapper">

    <div class="form-card">

        <div class="form-header">
            <h1>Create Invoice</h1>
            <p class="subtext">Build a professional invoice in seconds</p>
        </div>

        <form action="/invoice" method="POST">

            <div class="form-section">

                <h3>Customer Details</h3>

                <div class="form-grid-2">

                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" name="customer" required>
                    </div>

                    <div class="form-group">
                        <label>Invoice Number</label>
                        <input type="text" name="invoice_number" required>
                    </div>

                </div>

            </div>

            <div class="form-section">

                <h3>Payment Details</h3>

                <div class="form-grid-1">

                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" name="amount" required>
                    </div>

                </div>

            </div>

            <div class="form-footer">
                <button type="submit">Create Invoice</button>
            </div>

        </form>

    </div>

</div>

        </div>

    </div>

</div>

</body>

</html>
